<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>健康日志 · 三餐/训练/体测</title>
<meta name="theme-color" content="#2E7D66">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="健康日志">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232E7D66'/%3E%3Cpath d='M8 17h16v2a8 8 0 0 1-16 0z' fill='none' stroke='%23fff' stroke-width='2.2'/%3E%3Cpath d='M14 8v3M18 8v3' stroke='%23fff' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
  :root{
    --bg:#F5F7F2;
    --surface:#FFFFFF;
    --ink:#20332C;
    --muted:#6C7C75;
    --line:#DEE6DF;
    --primary:#2E7D66;
    --primary-ink:#1E5A49;
    --primary-soft:#E3F0EA;
    --accent:#D99A2B;
    --accent-soft:#F7EBD3;
    --danger:#C65A4B;
    --danger-soft:#F8E7E3;
    --radius:14px;
    --shadow:0 1px 2px rgba(32,51,44,.05), 0 6px 18px rgba(32,51,44,.06);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Noto Sans SC','PingFang SC','Segoe UI',Arial,sans-serif;
    color:var(--ink);
    background-color:var(--bg);
    background-image:radial-gradient(#D9E3DC 1px, transparent 1.2px);
    background-size:22px 22px;
    min-height:100vh;
  }
  .app{max-width:520px;margin:0 auto;padding:14px 14px 96px;}
  .num{font-family:'Noto Serif SC',serif;}

  /* ===== 顶部条 ===== */
  .topbar{display:flex;align-items:center;gap:10px;padding:6px 2px 14px;}
  .logo{width:34px;height:34px;border-radius:10px;background:var(--primary);display:flex;align-items:center;justify-content:center;color:#fff;flex:none;}
  .logo svg{width:20px;height:20px;}
  .topbar .t{font-weight:700;font-size:16px;letter-spacing:.2px;}
  .topbar .s{font-size:11.5px;color:var(--muted);margin-top:1px;}

  /* ===== 通用卡片 ===== */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);margin-bottom:12px;}
  .card h2{font-size:14px;font-weight:700;margin:0 0 10px;display:flex;align-items:center;gap:8px;}
  .card h2 .tag{font-size:10.5px;font-weight:500;color:var(--primary-ink);background:var(--primary-soft);padding:2px 8px;border-radius:999px;}
  .muted{color:var(--muted);}
  .small{font-size:12px;}
  .xs{font-size:11px;}
  .empty{color:var(--muted);font-size:12.5px;padding:10px 2px;line-height:1.6;}

  /* ===== 日期导航 ===== */
  .datenav{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:12px;box-shadow:var(--shadow);}
  .datenav .d{font-size:13.5px;font-weight:600;}
  .datenav .sub{font-size:11px;color:var(--muted);}
  .iconbtn{width:34px;height:34px;border:none;background:var(--primary-soft);color:var(--primary-ink);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .iconbtn:disabled{opacity:.4;cursor:default;}
  .iconbtn svg{width:17px;height:17px;}

  /* ===== 按钮 ===== */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:11px;font-size:13.5px;font-weight:600;padding:11px 14px;cursor:pointer;font-family:inherit;}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-soft{background:var(--primary-soft);color:var(--primary-ink);}
  .btn-line{background:var(--surface);color:var(--primary-ink);border:1px solid var(--line);}
  .btn-danger{background:var(--danger-soft);color:var(--danger);}
  .btn-block{width:100%;}
  .btn:disabled{opacity:.5;cursor:default;}
  .btn svg{width:16px;height:16px;}

  /* ===== 表单 ===== */
  .field{margin-bottom:11px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;}
  .inp,.sel,textarea.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;font-size:14px;font-family:inherit;color:var(--ink);background:#FBFCF9;outline:none;}
  .inp:focus,.sel:focus,textarea.inp:focus{border-color:var(--primary);background:#fff;}
  .row{display:flex;gap:9px;}
  .row>*{flex:1;min-width:0;}
  textarea.inp{resize:vertical;min-height:64px;line-height:1.6;}

  /* ===== 三餐 ===== */
  .mealtabs{display:flex;gap:6px;margin-bottom:12px;}
  .mealtabs button{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:11px;padding:9px 0;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
  .mealtabs button.on{background:var(--primary);border-color:var(--primary);color:#fff;}
  .meal-total{display:flex;align-items:baseline;gap:8px;padding:4px 2px 10px;}
  .meal-total .big{font-size:30px;font-weight:700;color:var(--primary-ink);}
  .meal-total .u{font-size:12px;color:var(--muted);}

  .item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);}
  .item:first-child{border-top:none;}
  .item .nm{flex:1;min-width:0;}
  .item .nm .a{font-size:14px;font-weight:600;line-height:1.4;}
  .item .nm .b{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .item .cal{font-family:'Noto Serif SC',serif;font-size:14px;font-weight:600;color:var(--primary-ink);white-space:nowrap;}
  .item .cal.pending{color:#B2BFB8;}
  .del{width:28px;height:28px;border:none;background:transparent;color:#A9B8B0;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:8px;flex:none;}
  .del:hover{background:var(--danger-soft);color:var(--danger);}
  .del svg{width:15px;height:15px;}

  /* ===== 训练 ===== */
  .wentry{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);}
  .wentry:first-child{border-top:none;}
  .wentry .who{width:42px;height:42px;border-radius:12px;background:var(--primary-soft);color:var(--primary-ink);display:flex;align-items:center;justify-content:center;flex:none;}
  .wentry .who svg{width:21px;height:21px;}
  .wentry .bd{flex:1;min-width:0;}
  .wentry .bd .t{font-size:14px;font-weight:600;}
  .wentry .bd .m{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.5;}
  .wentry .bd .ana{margin-top:8px;background:var(--primary-soft);border-radius:10px;padding:9px 11px;font-size:12.5px;line-height:1.7;color:var(--ink);}
  .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}

  /* ===== 趋势 ===== */
  .metric2{display:flex;gap:10px;margin-bottom:12px;}
  .metric2 .mc{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;box-shadow:var(--shadow);}
  .metric2 .mc .k{font-size:11.5px;color:var(--muted);}
  .metric2 .mc .v{font-size:21px;font-weight:700;margin-top:3px;}
  .metric2 .mc .v .u{font-size:11px;color:var(--muted);font-weight:400;}
  .goaltag{font-size:11px;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 8px;margin-left:6px;font-weight:600;}
  .chartbox{width:100%;}
  .chartbox svg{display:block;width:100%;height:auto;}
  .chartlegend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin-top:8px;}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:baseline;}
  .advice{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.85;white-space:pre-wrap;}

  /* ===== 状态打分 ===== */
  .score{display:flex;gap:10px;justify-content:space-between;margin-top:4px;}
  .score button{flex:1;border:1px solid var(--line);background:#FBFCF9;border-radius:11px;padding:9px 0;font-size:13px;color:var(--muted);cursor:pointer;font-family:inherit;}
  .score button.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:700;}
  .score button .n{display:block;font-size:15px;font-weight:700;}
  .score button .l{display:block;font-size:10px;margin-top:1px;}

  /* ===== 底部导航 ===== */
  .tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(10px + env(safe-area-inset-bottom));z-index:50;}
  .tabbar button{flex:1;border:none;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;cursor:pointer;font-family:inherit;border-radius:10px;}
  .tabbar button svg{width:22px;height:22px;}
  .tabbar button span{font-size:10.5px;font-weight:600;}
  .tabbar button.on{color:var(--primary-ink);background:var(--primary-soft);}

  /* ===== Toast / 加载 ===== */
  #toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:rgba(32,51,44,.92);color:#fff;font-size:13px;padding:10px 16px;border-radius:10px;max-width:86%;z-index:100;opacity:0;pointer-events:none;transition:opacity .25s;text-align:center;}
  #toast.show{opacity:1;}
  #loader{position:fixed;inset:0;background:rgba(245,247,242,.6);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;z-index:90;flex-direction:column;gap:10px;}
  #loader .spin{width:34px;height:34px;border:3px solid var(--primary-soft);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;}
  #loader .tx{font-size:13px;color:var(--primary-ink);font-weight:600;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .linkbtn{border:none;background:none;color:var(--primary-ink);font-size:13px;font-weight:600;cursor:pointer;padding:2px 0;font-family:inherit;text-decoration:underline;text-underline-offset:3px;}
  hr.sep{border:none;border-top:1px solid var(--line);margin:14px 0;}
  .kv{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-top:1px solid var(--line);}
  .kv:first-of-type{border-top:none;}
  .kv .k{color:var(--muted);}
  .kv .v{font-weight:600;}
  .bars{display:flex;align-items:flex-end;gap:6px;height:74px;margin-top:10px;}
  .bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;}
  .bars .bar{width:100%;max-width:34px;background:var(--primary-soft);border-radius:5px 5px 2px 2px;position:relative;}
  .bars .bar.filled{background:var(--primary);}
  .bars .bar.today{outline:2px solid var(--primary);outline-offset:1px;}
  .bars .l{font-size:9.5px;color:var(--muted);}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="logo" id="logoBtn" role="button" aria-label="回首页">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11 12 4l8 7"/><path d="M6.5 9.6V20h11V9.6"/></svg>
    </div>
    <div>
      <div class="t">健康日志</div>
      <div class="s">三餐 · 训练 · 体测 · AI 建议</div>
    </div>
  </header>
  <main id="view"></main>
</div>
<nav class="tabbar" id="tabbar"></nav>
<div id="loader"><div class="spin"></div><div class="tx" id="loaderTx">处理中…</div></div>
<div id="toast"></div>

<script>
/* ============================================================
   健康日志 —— 纯前端个人健康记录工具
   数据存本机浏览器 localStorage；AI 能力调用 DeepSeek API
   ============================================================ */

/* ---------- 常量与提示词 ---------- */
var CAL_PROMPT = '你是营养热量估算助手。根据用户给出的食物名称和大致分量，估算每份的热量（千卡）以及蛋白质、碳水化合物、脂肪（克）。只返回 JSON，不要任何其他文字或标记，格式严格为：{"items":[{"name":"食物名","calories":数字,"protein":数字,"carbs":数字,"fat":数字}],"total_calories":数字}。条数必须与输入一致且保持顺序。无法精确的食物给合理估计值。';
var TRAIN_PROMPT = '你是健身训练分析教练。根据用户一次训练记录，给出简短、具体、可执行的点评（150字以内）：训练量是否合理、可调整点、恢复与下次训练建议。用中文，不要寒暄，不要用列表符号以外的格式。';
var ADVICE_PROMPT = '你是私人健康教练兼营养师。根据用户最近一段时间的三餐热量、训练记录、体重和体脂数据，以及他设定的目标，给出周度建议（400字以内，分点）：1)当前进展与目标差距；2)饮食热量调整建议；3)训练调整建议；4)下周重点关注。用中文，语气客观务实，基于提供的数据说话，不要编造没有的数据。';

/* ---------- 存储 ---------- */
var LS_DB='hk_db_v1', LS_KEY='hk_api_key', LS_MODEL='hk_model';
var DB;
function defaultDB(){ return {meals:{},workouts:[],measures:[],conditions:{},goals:{weight:null,bodyFat:null}}; }
function load(){ try{ DB=Object.assign(defaultDB(), JSON.parse(localStorage.getItem(LS_DB)||'{}')); }catch(e){ DB=defaultDB(); } }
function save(){ try{ localStorage.setItem(LS_DB, JSON.stringify(DB)); }catch(e){ toast('无法写入本地存储：请用本地服务器方式打开页面'); } }
function getKey(){ try{ return localStorage.getItem(LS_KEY)||''; }catch(e){ return ''; } }
function setKey(k){ try{ localStorage.setItem(LS_KEY,k); }catch(e){} }
function getModel(){ try{ return localStorage.getItem(LS_MODEL)||'deepseek-chat'; }catch(e){ return 'deepseek-chat'; } }
function setModel(m){ try{ localStorage.setItem(LS_MODEL,m); }catch(e){} }

/* ---------- 工具 ---------- */
function $(s){ return document.querySelector(s); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function uid(){ return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayStr(){ return fmtDate(new Date()); }
function fmtDate(d){ var y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),da=String(d.getDate()).padStart(2,'0'); return y+'-'+m+'-'+da; }
function addDays(s,n){ var p=s.split('-'); var d=new Date(+p[0],+p[1]-1,+p[2]+n); return fmtDate(d); }
function weekdayCN(s){ var p=s.split('-'); var d=new Date(+p[0],+p[1]-1,+p[2]); return '周'+'日一二三四五六'[d.getDay()]; }
function escNL(s){ return esc(s).replace(/\n/g,'<br>'); }

var toastTimer=null;
function toast(msg){ var t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.classList.remove('show'); },2600); }
function setLoading(on, tx){ var l=$('#loader'); if(tx) $('#loaderTx').textContent=tx; l.style.display=on?'flex':'none'; }
function needKey(){ if(!getKey()){ toast('请先在「设置」填写 DeepSeek API Key'); nav('settings'); return false; } return true; }

/* ---------- 日期状态 ---------- */
var selDate = todayStr();
var selMeal = 'breakfast';
var MEAL_CN = {breakfast:'早餐', lunch:'午餐', dinner:'晚餐', snack:'加餐'};
var MEAL_ORDER = ['breakfast','lunch','dinner','snack'];

/* ---------- 数据访问 ---------- */
function dayMeals(date){ if(!DB.meals[date]) DB.meals[date]={breakfast:[],lunch:[],dinner:[],snack:[]}; return DB.meals[date]; }
function mealTotal(items){ return items.reduce(function(s,i){ return s+(typeof i.calories==='number'?i.calories:0); },0); }
function dayCalories(date){ var m=dayMeals(date); return MEAL_ORDER.reduce(function(s,k){ return s+mealTotal(m[k]); },0); }
function dayWorkout(date){ return DB.workouts.filter(function(w){ return w.date===date; }); }
function sortedMeasures(){ return DB.measures.slice().sort(function(a,b){ return a.date<b.date?-1:1; }); }
function latestMeasure(){ var s=sortedMeasures(); return s.length?s[s.length-1]:null; }

/* ---------- DeepSeek ---------- */
function dsChat(messages, jsonMode){
  var key=getKey(), model=getModel();
  var body={model:model,messages:messages,stream:false};
  if(jsonMode) body.response_format={type:'json_object'};
  return fetch('https://api.deepseek.com/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
    body:JSON.stringify(body)
  }).then(function(res){
    if(!res.ok){ return res.text().then(function(t){ throw new Error('DeepSeek HTTP '+res.status+' '+(t||'').slice(0,180)); }); }
    return res.json();
  }).then(function(data){
    var c=data&&data.choices&&data.choices[0];
    if(!c||!c.message) throw new Error('DeepSeek 返回异常');
    return c.message.content;
  });
}
function parseJson(text){
  text=String(text||'').trim();
  var f=text.indexOf('{'), l=text.lastIndexOf('}');
  if(f>=0 && l>f){ try{ return JSON.parse(text.slice(f,l+1)); }catch(e){} }
  try{ return JSON.parse(text); }catch(e){ throw new Error('无法解析 AI 返回的 JSON'); }
}

/* ---------- 路由 ---------- */
var ROUTES={today:renderToday, meals:renderMeals, workout:renderWorkout, trends:renderTrends, settings:renderSettings};
function currentRoute(){ var h=location.hash.replace(/^#\/?/,'').split('?')[0]; return ROUTES[h]?h:'today'; }
function nav(r){ if(currentRoute()!==r) location.hash='#/'+r; else render(); }
function render(){ var r=currentRoute(); $('#view').innerHTML=ROUTES[r](); renderTabbar(r); window.scrollTo(0,0); }
function renderTabbar(r){
  var items=[['today','今日'],['meals','三餐'],['workout','训练'],['trends','趋势'],['settings','设置']];
  var icons={today:'<path d="M4 11 12 4l8 7"/><path d="M6.5 9.6V20h11V9.6"/>',
    meals:'<path d="M4 10h16v2a8 8 0 0 1-16 0z"/><path d="M12 4.5V8M9 5.5V8M15 5.5V8"/>',
    workout:'<path d="M6.5 9v6M4 10.5v3M17.5 9v6M20 10.5v3M6.5 12h11"/>',
    trends:'<path d="M4 17 9 11l3.5 3.5L20 7"/><path d="M15 7h5v5"/>',
    settings:'<circle cx="12" cy="12" r="3"/><path d="M12 3v2.4M12 18.6V21M3 12h2.4M18.6 12H21M5.6 5.6l1.7 1.7M16.7 16.7l1.7 1.7M18.4 5.6l-1.7 1.7M7.3 16.7l-1.7 1.7"/>'};
  $('#tabbar').innerHTML=items.map(function(it){ var on=it[0]===r?'on':''; return '<button class="'+on+'" data-nav="'+it[0]+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+icons[it[0]]+'</svg><span>'+it[1]+'</span></button>'; }).join('');
}
document.addEventListener('click', function(e){
  var navBtn=e.target.closest('[data-nav]'); if(navBtn){ nav(navBtn.getAttribute('data-nav')); }
});
window.addEventListener('hashchange', render);

/* ---------- 图表（手写 SVG） ---------- */
function lineChartSVG(points, color, unit){
  var W=440,H=150,PAD=20,n=points.length;
  if(n===0) return '<div class="empty">暂无数据，先去「趋势」记录一次体重/体脂。</div>';
  var min=Math.min.apply(null,points), max=Math.max.apply(null,points);
  var span=(max-min)||1;
  function x(i){ return PAD + i*(W-2*PAD)/(n-1); }
  function y(v){ return H-PAD - (v-min)*(H-2*PAD)/span; }
  var pts=points.map(function(v,i){ return x(i).toFixed(1)+','+y(v).toFixed(1); }).join(' ');
  var area=n>1?'<polygon points="'+PAD+','+(H-PAD)+' '+pts+' '+(W-PAD)+','+(H-PAD)+'" fill="'+color+'26" stroke="none"/>':'';
  var line='<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>';
  var dots=points.map(function(v,i){ return '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(v).toFixed(1)+'" r="'+(i===n-1?3.4:2.2)+'" fill="#fff" stroke="'+color+'" stroke-width="1.8"/>'; }).join('');
  var last=points[n-1];
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%">'+area+line+dots+
    '<text x="'+PAD+'" y="'+(H-4)+'" font-size="10" fill="#6C7C75" font-family="sans-serif">'+min.toFixed(1)+'</text>'+
    '<text x="'+(W-PAD)+'" y="'+(H-4)+'" font-size="10" fill="#6C7C75" text-anchor="end" font-family="sans-serif">'+max.toFixed(1)+'</text>'+

/* ---------- 事件绑定：三餐 ---------- */
function bindMeals(){
  var p=$('#mPrev'),n=$('#mNext');
  if(p) p.addEventListener('click',function(){ selDate=addDays(selDate,-1); render(); });
  if(n) n.addEventListener('click',function(){ selDate=addDays(selDate,1); render(); });
  $('#view').querySelectorAll('[data-meal]').forEach(function(b){ b.addEventListener('click',function(){ selMeal=b.getAttribute('data-meal'); render(); }); });
  $('#view').querySelectorAll('[data-delmeal]').forEach(function(b){ b.addEventListener('click',function(){ var i=+b.getAttribute('data-delmeal'); dayMeals(selDate)[selMeal].splice(i,1); save(); render(); }); });
  var ad=$('#addItem'); if(ad) ad.addEventListener('click',function(){
    var nm=$('#fdName').value.trim(), amt=$('#fdAmt').value.trim();
    if(!nm){ toast('请填写食物名称'); return; }
    dayMeals(selDate)[selMeal].push({name:nm,amount:amt,calories:null});
    save(); render();
  });
  var ai=$('#aiMeal'); if(ai) ai.addEventListener('click',aiEstimateMeal);
}
function aiEstimateMeal(){
  if(!needKey()) return;
  var items=dayMeals(selDate)[selMeal].filter(function(i){ return i.name.trim(); });
  if(!items.length){ toast('这一餐还没有食物'); return; }
  setLoading(true,'AI 估算本餐热量…');
  var desc=items.map(function(i){ return i.name+(i.amount?'（'+i.amount+'）':''); }).join('；');
  dsChat([{role:'system',content:CAL_PROMPT},{role:'user',content:desc}], true).then(function(content){
    var j=parseJson(content), list=(j&&Array.isArray(j.items))?j.items:[];
    items.forEach(function(it,idx){ var r=list[idx]; if(r&&typeof r.calories==='number') it.calories=Math.round(r.calories); });
    save(); render(); toast('估算完成，已填入热量');
  }).catch(function(e){ toast('估算失败：'+e.message); }).then(function(){ setLoading(false); });
}

/* ---------- 事件绑定：训练 ---------- */
function bindWorkout(){
  var ad=$('#addWorkout'); if(ad) ad.addEventListener('click',function(){
    var date=$('#wDate').value||todayStr();
    var type=$('#wType').value, name=$('#wName').value.trim()||type;
    var dur=$('#wDur').value, sets=$('#wSets').value, reps=$('#wReps').value;
    var inten=$('#wInt').value, note=$('#wNote').value.trim();
    DB.workouts.push({id:uid(),date:date,type:type,name:name,duration:dur?+dur:null,sets:sets?+sets:null,reps:reps?+reps:null,intensity:inten,note:note,analysis:''});
    save(); toast('训练已保存'); render();
  });
  $('#view').querySelectorAll('[data-aiw]').forEach(function(b){ b.addEventListener('click',function(){ aiAnalyze(b.getAttribute('data-aiw')); }); });
  $('#view').querySelectorAll('[data-delw]').forEach(function(b){ b.addEventListener('click',function(){
    var id=b.getAttribute('data-delw');
    if(!confirm('删除这条训练记录？')) return;
    DB.workouts=DB.workouts.filter(function(x){ return x.id!==id; }); save(); render();
  }); });
}
function aiAnalyze(id){
  if(!needKey()) return;
  var w=DB.workouts.find(function(x){ return x.id===id; }); if(!w) return;
  setLoading(true,'AI 分析本次训练…');
  var desc='日期 '+w.date+'；项目 '+w.type+(w.name&&w.name!==w.type?' - '+w.name:'')+'; '+
    (w.duration?'时长 '+w.duration+' 分钟；':'')+(w.sets?'组数 '+w.sets+'；':'')+(w.reps?'每组 '+w.reps+' 次；':'')+
    '强度 '+w.intensity+(w.note?'；备注 '+w.note:'');
  dsChat([{role:'system',content:TRAIN_PROMPT},{role:'user',content:desc}], false).then(function(c){
    w.analysis=String(c).trim(); save(); render(); toast('分析完成');
  }).catch(function(e){ toast('分析失败：'+e.message); }).then(function(){ setLoading(false); });
}

function buildHistorySummary(){
  var now=new Date(), end=fmtDate(now);
  var start=new Date(); start.setDate(now.getDate()-27); var startS=fmtDate(start);
  var lines=[];
  lines.push('数据范围：'+startS+' 至 '+end);
  // 每日热量
  var calRows=[];
  for(var d=startS; d<=end; d=addDays(d,1)){
    var c=dayCalories(d);
    if(c>0) calRows.push(d+' '+c+' 千卡');
  }
  lines.push('每日摄入热量（仅记录过三餐的日子）：'+(calRows.join('；')||'无'));
  lines.push('日均摄入（有记录的日子）：'+(calRows.length? Math.round(calRows.reduce(function(s,r){return s+Number(r.split(' ')[1]);},0)/calRows.length)+' 千卡':'无'));
  // 训练
  var ws=DB.workouts.filter(function(w){ return w.date>=startS && w.date<=end; });
  lines.push('训练记录共 '+ws.length+' 次：'+(ws.map(function(w){ return w.date+' '+w.type+(w.duration?' '+w.duration+'min':''); }).join('；')||'无'));
  // 体测
  var ms=sortedMeasures().filter(function(m){ return m.date>=startS && m.date<=end; });
  lines.push('体测记录：'+(ms.map(function(m){ return m.date+' 体重'+ (m.weight!=null?m.weight+'kg':'—')+' 体脂'+(m.bodyFat!=null?m.bodyFat+'%':'—'); }).join('；')||'无'));
  if(ms.length>=2){
    var a=ms[0],b=ms[ms.length-1];
    if(a.weight!=null&&b.weight!=null) lines.push('期间体重变化：'+(b.weight-a.weight>=0?'+':'')+(b.weight-a.weight).toFixed(1)+' kg');
    if(a.bodyFat!=null&&b.bodyFat!=null) lines.push('期间体脂变化：'+(b.bodyFat-a.bodyFat>=0?'+':'')+(b.bodyFat-a.bodyFat).toFixed(1)+' 个百分点');
  }
  var g=DB.goals||{};
  lines.push('目标：体重 '+(g.weight!=null?g.weight+'kg':'未设')+'，体脂率 '+(g.bodyFat!=null?g.bodyFat+'%':'未设'));
  return lines.join('\n');
}
function aiWeeklyAdvice(){
  if(!needKey()) return;
  setLoading(true,'AI 生成周建议…');
  dsChat([{role:'system',content:ADVICE_PROMPT},{role:'user',content:buildHistorySummary()}], false).then(function(c){
    var box=$('#adviceBox'); if(box) box.innerHTML='<div class="advice">'+escNL(c)+'</div>';
    toast('建议已生成');
  }).catch(function(e){ toast('生成失败：'+e.message); }).then(function(){ setLoading(false); });
}

/* ---------- 事件绑定：设置 ---------- */
function bindSettings(){
  var tk=$('#toggleKey'); if(tk) tk.addEventListener('click',function(){ var i=$('#keyInp'); i.type=i.type==='password'?'text':'password'; });
  var sk=$('#saveKey'); if(sk) sk.addEventListener('click',function(){
    var v=$('#keyInp').value.trim();
    if(!v){ toast('Key 不能为空'); return; }
    setKey(v); toast('API Key 已保存');
  });
  var ms=$('#modelSel'); if(ms) ms.addEventListener('change',function(){ setModel(ms.value); toast('模型已切换：'+ms.value); });
  var eb=$('#exportBtn'); if(eb) eb.addEventListener('click',function(){
    var blob=new Blob([JSON.stringify({db:DB,key:getKey()},null,2)],{type:'application/json'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='health-backup-'+todayStr()+'.json'; a.click(); URL.revokeObjectURL(a.href);
    toast('已导出备份文件');
  });
  var cb=$('#clearBtn'); if(cb) cb.addEventListener('click',function(){
    if(!confirm('确定清空全部记录（三餐/训练/体测/目标）？此操作不可恢复。')) return;
    DB=defaultDB(); save(); toast('已清空'); render();
  });
}

/* ---------- 启动 ---------- */
var logo=$('#logoBtn');
if(logo) logo.addEventListener('click',function(){ nav('today'); });
load();
if(!location.hash){ location.hash='#/today'; }
render();
</script>
